name: host-container-static

on:
  pull_request:
    paths:
      - "container/**"
      - "profiles/**"
      - "scripts/host/**"
      - "tests/host/**"
      - "docs/containers.md"
      - ".github/workflows/host-container-static.yml"
  push:
    branches: [main]
    paths:
      - "container/**"
      - "profiles/**"
      - "scripts/host/**"
      - "tests/host/**"
      - "docs/containers.md"

jobs:
  static-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install profile composition dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - uses: docker/setup-compose-action@v1
        if: runner.os != 'Windows'
      - name: Python contracts
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:MAGI_PROFILE_PYTHON = (Get-Command python).Source
          python -m unittest discover -s tests/host -p 'test_*.py'
      - name: Shell syntax and Compose contract
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n container/entrypoint.sh scripts/host/build-image.sh scripts/host/diagnose.sh scripts/host/magi-seat.sh
          docker compose --env-file container/compose.static.env -f container/compose.yml config --quiet
      - name: Proxy topology integration
        if: runner.os == 'Linux'
        shell: bash
        run: tests/host/test_proxy_topology.sh
      - name: PowerShell parser contract
        shell: pwsh
        run: "[void][ScriptBlock]::Create([IO.File]::ReadAllText((Resolve-Path scripts/host/magi-seat.ps1)))"

# Windows is parser/static-contract validated here. The repository does not claim
# a real Windows Credential Manager + Docker Desktop execution without a Windows host.
